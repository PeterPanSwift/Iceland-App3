name: Build App Store IPA

# Needs a paid Apple Developer Program membership. Add these repository secrets
# (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         Contents of the AuthKey_XXXX.p8 file
# Optional repository variable:
#   BUNDLE_ID          Bundle identifier registered for the app (default com.peterpanswift.iceland)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to App Store Connect (TestFlight)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  appstore:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.peterpanswift.iceland' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. See the comment at the top of appstore.yml."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild archive \
            -project Iceland.xcodeproj -scheme Iceland -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Iceland.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 60

      - name: Export IPA
        run: |
          set -o pipefail
          DESTINATION=${{ inputs.upload && 'upload' || 'export' }}
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Iceland.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          ls -la build/export

      - name: Upload IPA artifact
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: Iceland-AppStore-ipa
          path: build/export/*.ipa

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
